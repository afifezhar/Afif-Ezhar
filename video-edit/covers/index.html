<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/cover.css" />
  </head>
  <body>
    <!-- Cover options: one still per second. Snapshot with --at 0.5,1.5,2.5,3.5 -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <!-- Cover 1: Soalan besar -->
      <div id="cover-1" class="clip" data-composition-id="cover-1" data-composition-src="compositions/cover-1.html" data-start="0" data-duration="1" data-track-index="0"></div>
      <!-- Cover 2: Statistik -->
      <div id="cover-2" class="clip" data-composition-id="cover-2" data-composition-src="compositions/cover-2.html" data-start="1" data-duration="1" data-track-index="0"></div>
      <!-- Cover 3: Real vs AI -->
      <div id="cover-3" class="clip" data-composition-id="cover-3" data-composition-src="compositions/cover-3.html" data-start="2" data-duration="1" data-track-index="0"></div>
      <!-- Cover 4: Tips -->
      <div id="cover-4" class="clip" data-composition-id="cover-4" data-composition-src="compositions/cover-4.html" data-start="3" data-duration="1" data-track-index="0"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
